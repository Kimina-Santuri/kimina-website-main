media:
  - name: images
    label: Images
    input: images
    output: /images
    categories: [image]
    rename: safe
  - name: downloads
    label: Download files
    input: downloads
    output: /downloads
    categories: [document, audio, compressed]
    rename: safe

settings:
  content:
    merge: true

components:
  gallery:
    type: object
    label: Gallery image
    fields:
      - { name: src, label: Image, type: image, required: true, options: { media: images } }
      - { name: alt, label: Alternative text, type: text, required: true }
      - { name: caption, label: Caption, type: string, required: true }
      - { name: wide, label: Wide layout, type: boolean, default: false }
  credit:
    type: object
    label: Credit
    fields:
      - { name: label, label: Label, type: string, required: true }
      - { name: value, label: Value, type: string, required: true }

content:
  - name: releases
    label: Releases
    type: collection
    path: site/content/releases
    format: yaml-frontmatter
    filename: { template: "{primary}.md", field: create }
    view:
      primary: title
      fields: [title, date, published]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: layout, type: string, hidden: true, default: project.njk }
      - { name: tags, type: string, list: true, hidden: true, default: [works, releases] }
      - { name: title, label: Title, type: string, required: true }
      - { name: display_title, label: Display title, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }
      - { name: date, label: Release date, type: date, required: true }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: work_types, type: string, list: true, hidden: true, default: [release] }
      - { name: type_label, type: string, hidden: true, default: Release }
      - { name: currentPage, type: string, hidden: true, default: works }
      - { name: animation, type: string, hidden: true, default: dots }
      - { name: collection_url, type: string, hidden: true, default: works.html }
      - { name: collection_label, type: string, hidden: true, default: works }
      - { name: image, label: Index image, type: image, required: true, options: { media: images } }
      - { name: image_alt, label: Index image alternative text, type: text, required: true }
      - { name: socialImage, label: Social image, type: image, options: { media: images } }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: hero_meta, label: Hero details, type: string, list: true }
      - { name: story_heading, label: Story heading, type: string, required: true }
      - { name: body, label: Story, type: rich-text, required: true, options: { media: images } }
      - { name: gallery_title, label: Gallery title, type: string }
      - { name: gallery, label: Gallery, component: gallery, list: true }
      - { name: credits, label: Credits, component: credit, list: true }
      - { name: external_url, label: External link, type: string }
      - { name: external_label, label: External link label, type: string }

  - name: performances
    label: Performances
    type: collection
    path: site/content/performances
    exclude: [smem-recap.md]
    format: yaml-frontmatter
    filename: { template: "{primary}.md", field: create }
    view:
      primary: title
      fields: [title, date, status, published]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: layout, type: string, hidden: true, default: project.njk }
      - { name: tags, type: string, hidden: true, default: performances }
      - { name: title, label: Title, type: string, required: true }
      - { name: display_title, label: Display title, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: status, label: Status, type: select, options: { values: [upcoming, archived] }, default: upcoming }
      - { name: type_label, type: string, hidden: true, default: Performance }
      - { name: currentPage, type: string, hidden: true, default: performances }
      - { name: animation, type: string, hidden: true, default: waveform }
      - { name: collection_url, type: string, hidden: true, default: performances.html }
      - { name: collection_label, type: string, hidden: true, default: performances }
      - { name: category, label: Event category, type: string, required: true }
      - { name: time, label: Time, type: string }
      - { name: programme, label: Programme or admission, type: string }
      - { name: location, label: Location, type: string }
      - { name: address, label: Address lines, type: string, list: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: lead_image, label: Lead image, type: image, required: true, options: { media: images } }
      - { name: lead_alt, label: Lead image alternative text, type: text, required: true }
      - { name: lead_caption, label: Lead image caption, type: string }
      - { name: hero_meta, label: Hero details, type: string, list: true }
      - { name: story_heading, label: Story heading, type: string, required: true }
      - { name: body, label: Story, type: rich-text, required: true, options: { media: images } }
      - { name: gallery_title, label: Gallery title, type: string }
      - { name: gallery, label: Gallery, component: gallery, list: true }
      - { name: credits, label: Credits, component: credit, list: true }
      - { name: external_url, label: External link, type: string }
      - { name: external_label, label: External link label, type: string }

  - name: residencies
    label: Residencies
    type: collection
    path: site/content/residencies
    format: yaml-frontmatter
    filename: { template: "{primary}.md", field: create }
    view:
      primary: title
      fields: [title, date, status, published]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: layout, type: string, hidden: true, default: project.njk }
      - { name: tags, type: string, list: true, hidden: true, default: [residencies, works] }
      - { name: title, label: Title, type: string, required: true }
      - { name: display_title, label: Display title, type: string, required: true }
      - { name: description, label: Search description, type: text, required: true }
      - { name: date, label: Closing or publication date, type: date, required: true }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: status, label: Status, type: select, options: { values: [upcoming, current, archived] }, default: upcoming }
      - { name: work_types, label: Work categories, type: select, options: { values: [research, collaboration, installation, instrument, release], multiple: true }, default: [research] }
      - { name: type_label, type: string, hidden: true, default: Residency }
      - { name: currentPage, type: string, hidden: true, default: residencies }
      - { name: animation, type: string, hidden: true, default: constellation }
      - { name: collection_url, type: string, hidden: true, default: residencies.html }
      - { name: collection_label, type: string, hidden: true, default: residencies }
      - { name: location, label: Location, type: string, required: true }
      - { name: duration, label: Duration, type: string }
      - { name: image, label: Index image, type: image, required: true, options: { media: images } }
      - { name: image_alt, label: Index image alternative text, type: text, required: true }
      - { name: summary, label: Short summary, type: text, required: true }
      - { name: hero_meta, label: Hero details, type: string, list: true }
      - { name: story_heading, label: Story heading, type: string, required: true }
      - { name: body, label: Story, type: rich-text, required: true, options: { media: images } }
      - { name: gallery_title, label: Gallery title, type: string }
      - { name: gallery, label: Gallery, component: gallery, list: true }
      - { name: credits, label: Credits, component: credit, list: true }
      - { name: external_url, label: External link, type: string }
      - { name: external_label, label: External link label, type: string }

  - name: downloads
    label: Downloads
    type: collection
    path: site/content/downloads
    format: yaml-frontmatter
    filename: { template: "{primary}.md", field: create }
    view:
      primary: title
      fields: [title, date, published]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: tags, type: string, hidden: true, default: downloads }
      - { name: permalink, type: string, hidden: true, default: false }
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Release date, type: date, required: true }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: kind, label: Type, type: string, required: true }
      - { name: summary, label: Description, type: text, required: true }
      - { name: file, label: Downloadable file, type: file, required: true, options: { media: downloads } }
